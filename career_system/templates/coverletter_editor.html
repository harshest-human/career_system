<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Letter Editor — {{ job.role_title }} at {{ job.company }}</title>
  <link rel="icon" href="/static/icon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0f172a;
      color: #334155;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    .top-toolbar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
    }
    .a4-container {
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }
    .letter-page {
      width: 210mm;
      min-height: 297mm;
      max-height: 297mm;
      padding: 14mm 18mm;
      background: #ffffff;
      color: #1e293b;
      font-size: 8.8pt;
      line-height: 1.38;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      border-radius: 4px;
      outline: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .letter-page:focus-within {
      box-shadow: 0 0 0 2px #3b82f6, 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    [contenteditable="true"] {
      outline: none;
      cursor: text;
    }
    [contenteditable="true"]:hover {
      background-color: rgba(59, 130, 246, 0.03);
      border-radius: 2px;
    }
    [contenteditable="true"]:focus {
      background-color: rgba(59, 130, 246, 0.06);
      border-radius: 2px;
    }
    @media print {
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-container {
        padding: 0 !important;
        margin: 0 !important;
      }
      .letter-page {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 14mm 18mm !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        overflow: hidden !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      [contenteditable="true"]:hover, [contenteditable="true"]:focus {
        background-color: transparent !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Toolbar -->
  <header class="no-print top-toolbar sticky top-0 z-50 px-4 sm:px-6 h-16 flex items-center justify-between text-white">
    <!-- Left: Back & Job Info -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <a href="/" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
      <div class="hidden md:block">
        <div class="font-bold text-sm text-white flex items-center gap-2">
          <span>Cover Letter Builder</span>
          <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono">Job #{{ job_id }}</span>
        </div>
        <div class="text-xs text-slate-400 truncate max-w-sm">{{ job.role_title }} &bull; {{ job.company }}</div>
      </div>
    </div>

    <!-- Center: Milestone Progress Links -->
    <div class="hidden lg:flex items-center space-x-1 bg-slate-900/80 px-2 py-1 rounded-xl border border-slate-700/80 text-xs">
      <a href="/job/{{ job_id }}" class="px-2.5 py-1 text-slate-400 hover:text-slate-200 rounded-lg transition font-medium">
        <i class="fa-solid fa-file-lines text-slate-400 mr-1"></i> Details
      </a>
      <a href="/job/{{ job_id }}/cv?lang={{ lang }}" class="px-2.5 py-1 text-slate-400 hover:text-slate-200 rounded-lg transition font-medium">
        <i class="fa-solid fa-id-card mr-1"></i> CV
      </a>
      <a href="/job/{{ job_id }}/coverletter?lang={{ lang }}" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg font-bold shadow-sm">
        <i class="fa-solid fa-envelope mr-1"></i> Cover Letter
      </a>
      <a href="/job/{{ job_id }}/outreach?lang={{ lang }}" class="px-2.5 py-1 text-slate-400 hover:text-slate-200 rounded-lg transition font-medium">
        <i class="fa-solid fa-paper-plane mr-1"></i> Outreach
      </a>
    </div>

    <!-- Right: Language toggle, Save & Download -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- Language Switch -->
      <div class="flex items-center bg-slate-900 rounded-lg border border-slate-700 p-0.5 text-xs font-semibold">
        <a href="/job/{{ job_id }}/coverletter?lang=en" class="px-2.5 py-1 rounded-md transition {% if lang == 'en' %}bg-blue-600 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
          🇬🇧 EN
        </a>
        <a href="/job/{{ job_id }}/coverletter?lang=de" class="px-2.5 py-1 rounded-md transition {% if lang == 'de' %}bg-blue-600 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
          🇩🇪 DE
        </a>
      </div>

      <!-- Auto-Save Status Badge -->
      <div id="save-status" class="hidden sm:flex items-center text-[11px] text-emerald-400 font-medium">
        <i class="fa-solid fa-check-circle mr-1 text-xs"></i> Saved
      </div>

      <!-- Explicit Save Button -->
      <button onclick="saveDocumentNow()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-floppy-disk text-blue-400"></i> Save
      </button>

      <!-- Print / Download PDF -->
      <button onclick="window.print()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg shadow-md transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-pdf"></i> Download PDF
      </button>
    </div>
  </header>

  <!-- Document Canvas -->
  <main class="flex-1 a4-container">
    <div id="document-canvas" class="letter-page" contenteditable="true" spellcheck="false">
      {{ doc_html | safe }}
    </div>
  </main>

  <script>
    const jobId = {{ job_id }};
    const docLang = '{{ lang }}';
    let saveTimeout = null;
    const canvas = document.getElementById('document-canvas');
    const statusEl = document.getElementById('save-status');

    function sanitizeCanvas() {
      const nestedPage = canvas.querySelector('.letter-page');
      if (nestedPage && nestedPage !== canvas) {
        canvas.innerHTML = nestedPage.innerHTML;
      }
    }
    sanitizeCanvas();

    canvas.addEventListener('input', () => {
      statusEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1 text-xs text-amber-400"></i> Saving...';
      statusEl.className = 'hidden sm:flex items-center text-[11px] text-amber-400 font-medium';
      
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveDocumentNow();
      }, 1200);
    });

    async function saveDocumentNow() {
      try {
        const content = canvas.innerHTML;
        const fullHtml = `<!DOCTYPE html>
<html lang="${docLang}">
<head>
  <meta charset="UTF-8">
  <title>Cover Letter</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 210mm; height: 297mm; max-height: 297mm; margin: 0 auto; background: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-size: 8.8pt; line-height: 1.38; color: #1e293b; -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden; }
    .letter-page { width: 210mm; height: 297mm; max-height: 297mm; box-sizing: border-box; padding: 14mm 18mm; margin: 0 auto; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #2563eb; padding-bottom: 7px; margin-bottom: 11px; }
    .name { font-size: 16pt; font-weight: 800; color: #1e3a8a; letter-spacing: -0.4px; line-height: 1.1; }
    .contact-info { text-align: right; font-size: 8pt; color: #475569; line-height: 1.35; }
    .contact-info a { color: #2563eb; text-decoration: none; }
    .recipient { margin-bottom: 9px; font-size: 8.8pt; color: #334155; line-height: 1.35; }
    .date-line { margin-bottom: 9px; font-size: 8.5pt; color: #64748b; }
    .subject-line { font-size: 10.2pt; font-weight: 700; color: #0f172a; margin-bottom: 9px; }
    .salutation { margin-bottom: 8px; font-size: 8.8pt; font-weight: 600; }
    .letter-para { margin-bottom: 7.5px; text-align: justify; color: #334155; font-size: 8.8pt; line-height: 1.36; }
    .closing { margin-top: 10px; margin-bottom: 4px; font-size: 8.8pt; color: #334155; }
    .signature-name { font-weight: 700; color: #0f172a; font-size: 9pt; }
  </style>
</head>
<body>
  <div class="letter-page">
    ${content}
  </div>
</body>
</html>`;

        const res = await fetch(`/api/jobs/${jobId}/doc/coverletter/${docLang}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ html_content: fullHtml })
        });

        if (res.ok) {
          statusEl.innerHTML = '<i class="fa-solid fa-check-circle mr-1 text-xs"></i> Saved to folder';
          statusEl.className = 'hidden sm:flex items-center text-[11px] text-emerald-400 font-medium';
        }
      } catch (err) {
        console.error('Save error:', err);
        statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1 text-xs"></i> Save error';
        statusEl.className = 'hidden sm:flex items-center text-[11px] text-rose-400 font-medium';
      }
    }
  </script>
</body>
</html>
