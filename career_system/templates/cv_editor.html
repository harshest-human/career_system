<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Studio — {{ job.role_title }} at {{ job.company }}</title>
  <link rel="icon" href="/static/icon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* --- Base Page & Print Settings --- */
    @page {
      size: A4 portrait;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0b0f19;
      color: #334155;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    .top-toolbar {
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e293b;
    }
    .sub-toolbar {
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }
    .a4-container {
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }
    
    /* --- A4 CV Canvas Paper --- */
    .cv-page {
      width: 210mm;
      min-height: 297mm;
      max-height: 297mm;
      background: #ffffff;
      color: #1e293b;
      font-size: 8.5pt;
      line-height: 1.32;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      border-radius: 4px;
      outline: none;
      overflow: hidden;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .cv-page:focus-within {
      box-shadow: 0 0 0 2px #3b82f6, 0 12px 36px rgba(0, 0, 0, 0.55);
    }
    [contenteditable="true"] {
      outline: none;
      cursor: text;
    }
    [contenteditable="true"]:hover {
      background-color: rgba(59, 130, 246, 0.02);
    }
    [contenteditable="true"]:focus {
      background-color: rgba(59, 130, 246, 0.04);
    }
    .fmt-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .fmt-btn:hover {
      background: #374151;
      color: #ffffff;
      border-color: #4b5563;
    }
    .fmt-btn:active {
      transform: translateY(1px);
    }

    /* --- STRICT PHOTO CONSTRAINTS (Never blow up canvas) --- */
    .photo-box {
      width: 52px !important;
      height: 52px !important;
      min-width: 52px !important;
      max-width: 52px !important;
      min-height: 52px !important;
      max-height: 52px !important;
      aspect-ratio: 1/1 !important;
      border-radius: 6px !important;
      border: 1.5px solid #2563eb !important;
      overflow: hidden !important;
      background: #f1f5f9 !important;
      flex-shrink: 0 !important;
      display: inline-block !important;
    }
    .photo-box img {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .berlin-photo {
      width: 50px !important;
      height: 50px !important;
      min-width: 50px !important;
      max-width: 50px !important;
      min-height: 50px !important;
      max-height: 50px !important;
      aspect-ratio: 1/1 !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      border: 2px solid #0f172a !important;
      margin: 0 auto 4px auto !important;
      flex-shrink: 0 !important;
      display: block !important;
    }
    .berlin-photo img {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .stockholm-photo {
      width: 54px !important;
      height: 54px !important;
      min-width: 54px !important;
      max-width: 54px !important;
      min-height: 54px !important;
      max-height: 54px !important;
      aspect-ratio: 1/1 !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      border: 1.5px solid #0f172a !important;
      flex-shrink: 0 !important;
      display: inline-block !important;
    }
    .stockholm-photo img {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    /* --- DESIGN 1: ZURICH MINIMALIST CSS --- */
    .cv-design-zurich {
      padding: 10mm 13mm;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      font-size: 8.5pt;
      line-height: 1.32;
    }
    .cv-design-zurich .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 7px;
      margin-bottom: 8px;
    }
    .cv-design-zurich .header-left-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cv-design-zurich .header-left .name {
      font-size: 17pt;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: -0.4px;
      line-height: 1.1;
    }
    .cv-design-zurich .header-left .headline {
      font-size: 9pt;
      font-weight: 600;
      color: #334155;
      margin-top: 2px;
    }
    .cv-design-zurich .header-right {
      text-align: right;
      font-size: 7.8pt;
      color: #475569;
      line-height: 1.35;
    }
    .cv-design-zurich .header-right a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .cv-design-zurich .section {
      margin-bottom: 6px;
    }
    .cv-design-zurich .section-title {
      font-size: 8.5pt;
      font-weight: 700;
      color: #1e3a8a;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 1.5px;
      margin-bottom: 4px;
    }
    .cv-design-zurich .summary-text {
      font-size: 8.2pt;
      color: #334155;
      text-align: justify;
      line-height: 1.3;
    }
    .cv-design-zurich .entry {
      margin-bottom: 4px;
    }
    .cv-design-zurich .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .cv-design-zurich .entry-title {
      font-weight: 700;
      font-size: 8.5pt;
      color: #0f172a;
    }
    .cv-design-zurich .entry-date {
      font-size: 7.8pt;
      font-weight: 600;
      color: #475569;
    }
    .cv-design-zurich .entry-sub {
      font-size: 7.8pt;
      font-style: italic;
      color: #475569;
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5px;
    }
    .cv-design-zurich .cv-bullets {
      margin-left: 12px;
      padding-left: 0;
      font-size: 7.8pt;
      color: #334155;
      line-height: 1.26;
    }
    .cv-design-zurich .cv-bullets li {
      margin-bottom: 1px;
    }
    .cv-design-zurich .skill-line {
      font-size: 7.8pt;
      color: #334155;
      margin-bottom: 2px;
      line-height: 1.25;
    }
    .cv-design-zurich .skill-line strong {
      color: #0f172a;
    }

    /* --- DESIGN 2: BERLIN EXECUTIVE CSS --- */
    .cv-design-berlin {
      display: flex !important;
      flex-direction: row !important;
      padding: 0 !important;
      font-size: 8.4pt;
      line-height: 1.3;
    }
    .cv-design-berlin .berlin-sidebar {
      width: 68mm;
      min-width: 68mm;
      max-width: 68mm;
      background: #f8fafc;
      border-right: 1.5px solid #e2e8f0;
      padding: 10mm 7mm;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-sizing: border-box;
    }
    .cv-design-berlin .berlin-side-sec {
      margin-bottom: 5px;
    }
    .cv-design-berlin .berlin-side-title {
      font-size: 8pt;
      font-weight: 800;
      text-transform: uppercase;
      color: #0f172a;
      border-bottom: 1.5px solid #cbd5e1;
      padding-bottom: 2px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .cv-design-berlin .berlin-contact-item {
      font-size: 7.5pt;
      color: #475569;
      margin-bottom: 3px;
      word-break: break-word;
    }
    .cv-design-berlin .berlin-contact-item a {
      color: #2563eb;
      text-decoration: none;
    }
    .cv-design-berlin .berlin-main {
      flex: 1;
      padding: 10mm 10mm 10mm 9mm;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .cv-design-berlin .berlin-header {
      border-bottom: 2px solid #0f172a;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    .cv-design-berlin .berlin-name {
      font-size: 18pt;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1;
      text-transform: uppercase;
    }
    .cv-design-berlin .berlin-title {
      font-size: 9.5pt;
      font-weight: 600;
      color: #2563eb;
      margin-top: 2px;
    }
    .cv-design-berlin .berlin-sec-title {
      font-size: 8.6pt;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
      margin-bottom: 4px;
    }
    .cv-design-berlin .berlin-summary {
      font-size: 8pt;
      color: #334155;
      line-height: 1.32;
      text-align: justify;
      margin-bottom: 4px;
    }
    .cv-design-berlin .berlin-exp-item {
      margin-bottom: 4px;
    }
    .cv-design-berlin .berlin-exp-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .cv-design-berlin .berlin-exp-role {
      font-weight: 700;
      font-size: 8.5pt;
      color: #0f172a;
    }
    .cv-design-berlin .berlin-exp-date {
      font-size: 7.6pt;
      font-weight: 600;
      color: #64748b;
    }
    .cv-design-berlin .berlin-exp-inst {
      font-size: 7.8pt;
      font-style: italic;
      color: #475569;
      margin-bottom: 1.5px;
    }
    .cv-design-berlin .berlin-bullets {
      margin-left: 11px;
      font-size: 7.8pt;
      color: #334155;
      line-height: 1.25;
    }
    .cv-design-berlin .berlin-bullets li {
      margin-bottom: 1px;
    }
    .cv-design-berlin .berlin-edu-item {
      margin-bottom: 3px;
    }

    /* --- DESIGN 3: STOCKHOLM TECH CSS --- */
    .cv-design-stockholm {
      padding: 11mm 13mm;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      font-size: 8.5pt;
      line-height: 1.34;
      color: #0f172a;
    }
    .cv-design-stockholm .stockholm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #0f172a;
    }
    .cv-design-stockholm .stockholm-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cv-design-stockholm .stockholm-name {
      font-size: 19pt;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .cv-design-stockholm .stockholm-sub {
      font-size: 9.5pt;
      font-weight: 600;
      color: #0284c7;
      margin-top: 1px;
    }
    .cv-design-stockholm .stockholm-contact {
      text-align: right;
      font-size: 7.8pt;
      color: #475569;
      line-height: 1.35;
    }
    .cv-design-stockholm .stockholm-contact a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }
    .cv-design-stockholm .stockholm-sec {
      margin-bottom: 6px;
    }
    .cv-design-stockholm .stockholm-sec-title {
      font-size: 8.8pt;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .cv-design-stockholm .stockholm-sec-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .cv-design-stockholm .stockholm-summary {
      font-size: 8.2pt;
      color: #334155;
      line-height: 1.32;
      text-align: justify;
      margin-bottom: 4px;
    }
    .cv-design-stockholm .stockholm-item {
      margin-bottom: 4px;
    }
    .cv-design-stockholm .stockholm-item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .cv-design-stockholm .stockholm-role {
      font-weight: 800;
      font-size: 8.5pt;
      color: #0f172a;
    }
    .cv-design-stockholm .stockholm-inst {
      font-size: 8pt;
      font-weight: 500;
      color: #475569;
    }
    .cv-design-stockholm .stockholm-date {
      font-size: 7.8pt;
      font-weight: 700;
      color: #0284c7;
    }
    .cv-design-stockholm .stockholm-bullets {
      margin-left: 12px;
      font-size: 7.8pt;
      color: #334155;
      line-height: 1.26;
    }
    .cv-design-stockholm .stockholm-bullets li {
      margin-bottom: 1px;
    }
    .cv-design-stockholm .nordic-pill {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 7.4pt;
      font-weight: 600;
      color: #0f172a;
      margin: 1px 2px;
    }
    .cv-design-stockholm .stockholm-skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      font-size: 7.8pt;
    }

    /* --- Print Media Query --- */
    @media print {
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-container {
        padding: 0 !important;
        margin: 0 !important;
      }
      .cv-page {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        overflow: hidden !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      [contenteditable="true"]:hover, [contenteditable="true"]:focus {
        background-color: transparent !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Action & Navigation Toolbar -->
  <header class="no-print top-toolbar sticky top-0 z-50 px-4 sm:px-6 h-16 flex items-center justify-between text-white">
    <!-- Left: Navigation and Job Info -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <a href="/" class="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 text-xs font-semibold rounded-lg border border-zinc-700 transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-arrow-left text-blue-400"></i> Dashboard
      </a>
      <div class="hidden md:block">
        <div class="font-bold text-sm text-white flex items-center gap-2">
          <span>CV Studio</span>
          <span class="text-[11px] px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-300 font-semibold border border-blue-500/20">Tool by Harsh</span>
          <span class="text-[11px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono">Job #{{ job_id }}</span>
        </div>
        <div class="text-xs text-zinc-400 truncate max-w-sm">{{ job.role_title }} &bull; {{ job.company }}</div>
      </div>
    </div>

    <!-- Center: Milestone Navigation Links -->
    <div class="hidden lg:flex items-center space-x-1 bg-zinc-950/80 px-2 py-1 rounded-xl border border-zinc-800 text-xs">
      <a href="/job/{{ job_id }}" class="px-2.5 py-1 text-zinc-400 hover:text-zinc-200 rounded-lg transition font-medium">
        <i class="fa-solid fa-file-lines text-slate-400 mr-1"></i> Details
      </a>
      <a href="/job/{{ job_id }}/cv?lang={{ lang }}&design={{ design }}" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg font-bold shadow-sm">
        <i class="fa-solid fa-id-card mr-1"></i> CV
      </a>
      <a href="/job/{{ job_id }}/coverletter?lang={{ lang }}&design={{ design }}" class="px-2.5 py-1 text-zinc-400 hover:text-zinc-200 rounded-lg transition font-medium">
        <i class="fa-solid fa-envelope mr-1"></i> Cover Letter
      </a>
      <a href="/job/{{ job_id }}/outreach?lang={{ lang }}" class="px-2.5 py-1 text-zinc-400 hover:text-zinc-200 rounded-lg transition font-medium">
        <i class="fa-solid fa-paper-plane mr-1"></i> Outreach
      </a>
    </div>

    <!-- Right: Language toggle, Save & Download -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- Language Switch -->
      <div class="flex items-center bg-zinc-950 rounded-lg border border-zinc-800 p-0.5 text-xs font-semibold">
        <button onclick="switchLanguage('en')" class="px-2.5 py-1 rounded-md transition {% if lang == 'en' %}bg-blue-600 text-white font-bold{% else %}text-zinc-400 hover:text-white{% endif %}">
          🇬🇧 EN
        </button>
        <button onclick="switchLanguage('de')" class="px-2.5 py-1 rounded-md transition {% if lang == 'de' %}bg-blue-600 text-white font-bold{% else %}text-zinc-400 hover:text-white{% endif %}">
          🇩🇪 DE
        </button>
      </div>

      <!-- Auto-Save Status Badge -->
      <div id="save-status" class="hidden sm:flex items-center text-[11px] text-emerald-400 font-medium">
        <i class="fa-solid fa-check-circle mr-1 text-xs"></i> Saved
      </div>

      <!-- Explicit Save Button -->
      <button onclick="saveDocumentNow()" id="save-btn" class="px-3.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold rounded-lg border border-zinc-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-floppy-disk text-blue-400"></i> Save
      </button>

      <!-- Print / Download PDF -->
      <button onclick="window.print()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg shadow-md transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-pdf"></i> Download PDF
      </button>
    </div>
  </header>

  <!-- Sub-Toolbar: 3 European Designs + Word/Canva In-Place Formatting Tools -->
  <div class="no-print sub-toolbar px-4 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-3 text-xs sticky top-16 z-40">
    
    <!-- 1. Design Selector (Zurich, Berlin, Stockholm) -->
    <div class="flex items-center space-x-1.5">
      <span class="text-zinc-400 font-semibold mr-1 flex items-center gap-1">
        <i class="fa-solid fa-palette text-amber-400"></i> Design:
      </span>
      <button onclick="switchDesign('zurich')" id="btn-design-zurich" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 {% if design == 'zurich' %}bg-blue-600 text-white shadow{% else %}bg-zinc-800 text-zinc-300 hover:bg-zinc-700{% endif %}" title="Swiss Minimalist: Clean single-column layout, universal 100% ATS score">
        🇨🇭 Zurich Minimal
      </button>
      <button onclick="switchDesign('berlin')" id="btn-design-berlin" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 {% if design == 'berlin' %}bg-blue-600 text-white shadow{% else %}bg-zinc-800 text-zinc-300 hover:bg-zinc-700{% endif %}" title="German Executive: Corporate 2-column split layout with left skill sidebar">
        🇩🇪 Berlin Executive
      </button>
      <button onclick="switchDesign('stockholm')" id="btn-design-stockholm" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 {% if design == 'stockholm' %}bg-blue-600 text-white shadow{% else %}bg-zinc-800 text-zinc-300 hover:bg-zinc-700{% endif %}" title="Nordic Tech: Clean borderless timeline and tech badges">
        🇸🇪 Stockholm Tech
      </button>
    </div>

    <!-- 2. Profile Photo Controls & Formatting Tools (Word/Canva Style) -->
    <div class="flex flex-wrap items-center gap-1.5">
      <!-- Photo Space Manager -->
      <div class="relative inline-block">
        <input type="file" id="photo-file-input" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
        <button onclick="document.getElementById('photo-file-input').click()" class="fmt-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-200" title="Upload / change profile picture">
          <i class="fa-solid fa-camera text-blue-400"></i> Photo
        </button>
      </div>
      <button onclick="togglePhotoVisibility()" class="fmt-btn" title="Toggle photo box visibility">
        <i class="fa-solid fa-eye-slash text-zinc-400"></i> Toggle Photo
      </button>

      <span class="w-[1px] h-5 bg-zinc-700 mx-1"></span>

      <!-- Text Formatting (Word-like) -->
      <button onclick="formatDoc('bold')" class="fmt-btn font-black px-2.5" title="Bold (Ctrl+B)">B</button>
      <button onclick="formatDoc('italic')" class="fmt-btn italic px-2.5" title="Italic (Ctrl+I)">I</button>
      <button onclick="formatDoc('underline')" class="fmt-btn underline px-2.5" title="Underline (Ctrl+U)">U</button>
      <button onclick="formatDoc('insertUnorderedList')" class="fmt-btn" title="Bullet List">• List</button>

      <span class="w-[1px] h-5 bg-zinc-700 mx-1"></span>

      <!-- Alignment -->
      <button onclick="formatDoc('justifyLeft')" class="fmt-btn" title="Align Left"><i class="fa-solid fa-align-left"></i></button>
      <button onclick="formatDoc('justifyCenter')" class="fmt-btn" title="Align Center"><i class="fa-solid fa-align-center"></i></button>
      <button onclick="formatDoc('justifyFull')" class="fmt-btn" title="Justify"><i class="fa-solid fa-align-justify"></i></button>

      <span class="w-[1px] h-5 bg-zinc-700 mx-1"></span>

      <!-- Font Selector -->
      <select onchange="changeFontFamily(this.value)" class="bg-zinc-800 border border-zinc-700 text-zinc-200 rounded px-2 py-1 text-xs focus:outline-none">
        <option value="'Segoe UI', sans-serif">Segoe UI</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Helvetica Neue', Arial, sans-serif">Helvetica</option>
        <option value="'Georgia', serif">Georgia (Editorial)</option>
      </select>
    </div>

  </div>

  <!-- Document Editing Canvas -->
  <main class="flex-1 a4-container">
    <div id="document-canvas" class="cv-page cv-design-{{ design }}" contenteditable="true" spellcheck="false">
      <!-- Injected Document -->
      {{ doc_html | safe }}
    </div>
  </main>

  <script>
    const jobId = {{ job_id }};
    let docLang = '{{ lang }}';
    let currentDesign = '{{ design }}' || 'zurich';
    let currentPhotoSrc = null;
    let saveTimeout = null;
    const canvas = document.getElementById('document-canvas');
    const statusEl = document.getElementById('save-status');

    // Parse the inner CV content from the full HTML template safely
    function loadAndSanitizeCanvas() {
      const parser = new DOMParser();
      const rawHtml = canvas.innerHTML;
      const doc = parser.parseFromString(rawHtml, 'text/html');
      const pageDiv = doc.querySelector('.cv-page') || canvas.querySelector('.cv-page');
      
      if (pageDiv) {
        // Set proper design class on canvas
        const classNames = pageDiv.className.split(' ').filter(c => c.startsWith('cv-design-') || c === 'cv-page');
        if (classNames.length > 0) {
          canvas.className = classNames.join(' ');
        } else {
          canvas.className = 'cv-page cv-design-' + currentDesign;
        }
        canvas.innerHTML = pageDiv.innerHTML;
      }
      
      // Ensure canvas has the required design class
      if (!canvas.className.includes('cv-design-')) {
        canvas.classList.add('cv-design-' + currentDesign);
      }
    }
    loadAndSanitizeCanvas();

    // Word-like formatting command executor
    function formatDoc(cmd, value = null) {
      document.execCommand(cmd, false, value);
      canvas.focus();
    }

    // Font Family Switcher
    function changeFontFamily(font) {
      canvas.style.fontFamily = font;
    }

    // Switch European Design Template
    async function switchDesign(designName) {
      currentDesign = designName;
      statusEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1 text-xs text-blue-400"></i> Loading ' + designName + ' design...';
      statusEl.className = 'hidden sm:flex items-center text-[11px] text-blue-400 font-medium';

      // Update button highlights
      ['zurich', 'berlin', 'stockholm'].forEach(d => {
        const btn = document.getElementById('btn-design-' + d);
        if (btn) {
          if (d === designName) {
            btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-blue-600 text-white shadow';
          } else {
            btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-800 text-zinc-300 hover:bg-zinc-700';
          }
        }
      });

      try {
        const res = await fetch(`/api/jobs/${jobId}/render-template`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            doc_type: 'cv',
            lang: docLang,
            design: designName,
            photo_src: currentPhotoSrc,
            candidate_id: 'default'
          })
        });
        const data = await res.json();
        if (res.ok && data.html) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(data.html, 'text/html');
          const pageDiv = doc.querySelector('.cv-page');
          if (pageDiv) {
            canvas.className = pageDiv.className;
            canvas.innerHTML = pageDiv.innerHTML;
          } else {
            canvas.className = 'cv-page cv-design-' + designName;
            canvas.innerHTML = data.html;
          }
          statusEl.innerHTML = '<i class="fa-solid fa-check-circle mr-1 text-xs"></i> Switched to ' + designName;
          statusEl.className = 'hidden sm:flex items-center text-[11px] text-emerald-400 font-medium';
        }
      } catch (err) {
        console.error('Design switch error:', err);
      }
    }

    // Switch Language
    function switchLanguage(targetLang) {
      window.location.href = `/job/${jobId}/cv?lang=${targetLang}&design=${currentDesign}`;
    }

    // Photo Upload Handler
    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        currentPhotoSrc = evt.target.result;
        // Inject or update image in canvas
        let photoImg = canvas.querySelector('.photo-box img, .berlin-photo img, .stockholm-photo img');
        if (photoImg) {
          photoImg.src = currentPhotoSrc;
        } else {
          // Re-render design with new photo
          switchDesign(currentDesign);
        }
        saveDocumentNow();
      };
      reader.readAsDataURL(file);
    }

    // Toggle Photo Box Visibility
    function togglePhotoVisibility() {
      const photoBoxes = canvas.querySelectorAll('.photo-box, .berlin-photo, .stockholm-photo');
      if (photoBoxes.length > 0) {
        photoBoxes.forEach(p => {
          p.style.display = (p.style.display === 'none') ? '' : 'none';
        });
        saveDocumentNow();
      } else {
        alert('No photo attached yet. Click the Photo button to upload your headshot.');
      }
    }

    // Auto-save debounce on input
    canvas.addEventListener('input', () => {
      statusEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1 text-xs text-amber-400"></i> Saving...';
      statusEl.className = 'hidden sm:flex items-center text-[11px] text-amber-400 font-medium';
      
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveDocumentNow();
      }, 1200);
    });

    // Save directly to local folder and database via API
    async function saveDocumentNow() {
      try {
        const content = canvas.innerHTML;
        const currentClass = canvas.className;
        const fullHtml = `<!DOCTYPE html>
<html lang="${docLang}">
<head>
  <meta charset="UTF-8">
  <title>Curriculum Vitae</title>
</head>
<body>
  <div class="${currentClass}">
    ${content}
  </div>
</body>
</html>`;

        const res = await fetch(`/api/jobs/${jobId}/doc/cv/${docLang}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ html_content: fullHtml })
        });

        if (res.ok) {
          statusEl.innerHTML = '<i class="fa-solid fa-check-circle mr-1 text-xs"></i> Saved to folder';
          statusEl.className = 'hidden sm:flex items-center text-[11px] text-emerald-400 font-medium';
        }
      } catch (err) {
        console.error('Save error:', err);
        statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1 text-xs"></i> Save error';
        statusEl.className = 'hidden sm:flex items-center text-[11px] text-rose-400 font-medium';
      }
    }
  </script>
</body>
</html>
